framework:
    messenger:
        failure_transport: failed

        transports:
            logs_processing:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 5
                    max_delay: 0
                options:
                    exchange:
                        name: logs
                        type: direct
                        default_publish_routing_key: log
                    queues:
                        logs_processing:
                            binding_keys: ['log']

            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: logs_failed
                        type: direct
                    queues:
                        logs_failed: ~

        routing:
            App\Application\DTO\LogMessage: logs_processing

        buses:
            messenger.bus.default:
                middleware:
                    - App\Infrastructure\Messaging\Middleware\CorrelationMiddleware

when@test:
    framework:
        messenger:
            transports:
                logs_processing: 'in-memory://'
                failed: 'in-memory://'
